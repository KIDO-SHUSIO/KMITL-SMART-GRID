    <title>KMITL Smart Energy Saver · K-SES Dashboard</title>
    <script>
      // Clean up any duplicate room entries from previous tests in localStorage
      try {
        const raw = localStorage.getItem("ksesRooms");
        if (raw) {
          const list = JSON.parse(raw);
          const map = new Map();
          for (const r of list) {
            const key = (r.building + "-" + r.roomNumber).toLowerCase().replace(/\s+/g, "-");
            map.set(key, r);
          }
          localStorage.setItem("ksesRooms", JSON.stringify(Array.from(map.values())));
        }
      } catch (e) {}
    </script>
